name: whiskerchat
title: WhiskerChat Matrix Messenger
base: core24
adopt-info: whiskerchat
license: AGPL-3.0
summary: Monochrome open-source messenger for the Matrix network
description: |
  ## Your communication should be yours.

  WhiskerChat is a black-and-white messenger for the open Matrix network.

  ### Messaging how it should be

  Whether for your friends, your company or local community, WhiskerChat supports a variety of features to cover all your daily needs.

  #### Easy to use

  Simply install, log in and start chatting. The intuitive user interface makes secure communication as easy as possible.

  #### Secure

  With olm/megolm end-to-end encryption, encrypted message backups and an automated key trust system, WhiskerChat supports secure communication.

  #### Decentral

  Based on the open Matrix protocol we build a decentralized messaging network together, which no entity can control. Host your own chat server while remaining in contact with everyone.

  ### Feature rich and reliable

  From public chats with tens of thousands of participants and polls to custom stickers, spaces, moderation tools, and multi-device support, WhiskerChat delivers a comprehensive communication suite.

  #### Secure video calls

  Direct calls and video conferences, fully secured with Matrix RTC-compatible encryption.

  #### Not another walled garden

  WhiskerChat is compatible with other Matrix clients like Element, Nheko, Cinny or NeoChat. Learn more at matrix.org.

  #### Made by volunteers

  WhiskerChat is an open-source Matrix client based on open standards.

  Source code: https://github.com/thecathousemp3/whiskerchat

grade: stable
confinement: strict

platforms:
  amd64:
    build-on: amd64
  arm64:
    build-on: arm64

parts:
  flutter-git:
    source: .
    plugin: nil
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/usr/bin
      mkdir -p $CRAFT_PART_INSTALL/usr/libexec
      git clone --depth 1 --branch "$(jq -r .flutter .fvmrc)" https://github.com/flutter/flutter.git $CRAFT_PART_INSTALL/usr/libexec/flutter
      ln -s $CRAFT_PART_INSTALL/usr/libexec/flutter/bin/flutter $CRAFT_PART_INSTALL/usr/bin/flutter
      ln -s $CRAFT_PART_INSTALL/usr/libexec/flutter/bin/dart $SNAPCRAFT_PART_INSTALL/usr/bin/dart
      $CRAFT_PART_INSTALL/usr/bin/flutter doctor
    build-packages:
      - clang
      - cmake
      - curl
      - libgtk-3-dev
      - ninja-build
      - unzip
      - xz-utils
      - git
      - jq
      - zip
      - lld
      - llvm-18
    override-prime: ''

  whiskerchat:
    after: [flutter-git]
    plugin: nil
    source: .
    override-build: |
      craftctl set version="$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)"

      # Install rust manually:
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      export PATH="$HOME/.cargo/bin:$PATH"

      # Workaround for Flutter build error:
      rm -rf build

      flutter build linux --release -v
      mkdir -p $CRAFT_PART_INSTALL/bin/
      cp -r build/linux/*/release/bundle/* $CRAFT_PART_INSTALL/bin/
    build-packages:
      - libsecret-1-dev
      - libjsoncpp-dev
      - libssl-dev
      - curl
      - libpciaccess-dev
      - libpulse-dev
    stage-packages:
      - libsecret-1-0
      - libjsoncpp25
      - libpciaccess0
      - libpulse0
      - libmpv2
      - libblas3
      - liblapack3
    override-prime: | # Workaround for MediaKit:
      craftctl default
      for library_dir in "$CRAFT_PRIME"/usr/lib/*-linux-gnu; do
        if [ -e "$library_dir/libmpv.so.2" ]; then
          ln -sf "$(basename "$library_dir")/libmpv.so.2" "$CRAFT_PRIME/usr/lib/libmpv.so.2"
        fi
        ln -sf blas/libblas.so.3 "$library_dir/libblas.so.3"
        ln -sf lapack/liblapack.so.3 "$library_dir/liblapack.so.3"
      done

slots:
  dbus-svc:
    interface: dbus
    bus: session
    name: chat.fluffy.fluffychat

apps:
  whiskerchat:
    command: bin/whiskerchat
    extensions: [ gnome ]
    plugs:
      - desktop
      - desktop-legacy
      - home
      - network
      - network-manager
      - opengl
      - removable-media
      - browser-support
      - password-manager-service
      - camera
      - audio-record
      - audio-playback
    slots:
      - dbus-svc
    environment:
      LIBMPV_LIBRARY_PATH: $SNAP/usr/lib/libmpv.so.2 # Otherwise app does not find libmp3
